<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(184, 115, 51, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background gradient -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Grid pattern -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Main content -->
  <g>
    <!-- Circle accent -->
    <circle cx="600" cy="315" r="200" fill="none" stroke="rgba(184, 115, 51, 0.1)" stroke-width="2"/>
    <circle cx="600" cy="315" r="150" fill="none" stroke="rgba(184, 115, 51, 0.15)" stroke-width="1"/>

    <!-- Main title -->
    <text x="600" y="180" font-family="'IBM Plex Mono', monospace" font-size="96" font-weight="700" fill="#b87333" text-anchor="middle" letter-spacing="3">
      SATILIK
    </text>
    <text x="600" y="290" font-family="'IBM Plex Mono', monospace" font-size="96" font-weight="700" fill="#b87333" text-anchor="middle" letter-spacing="3">
      ALAN ADI
    </text>

    <!-- Domain -->
    <text x="600" y="380" font-family="'IBM Plex Mono', monospace" font-size="60" font-weight="600" fill="#b87333" text-anchor="middle" letter-spacing="2">
      www.endustrirulman.com
    </text>

    <!-- Subtitle -->
    <text x="600" y="450" font-family="Arial, sans-serif" font-size="40" font-weight="400" fill="#f0f0f0" text-anchor="middle">
      Premium Endüstri Domain
    </text>

    <!-- Description -->
    <text x="600" y="520" font-family="Arial, sans-serif" font-size="28" fill="#a8a8a8" text-anchor="middle">
      Açık Arttırma • 150.000 TL'den başlayan teklifler
    </text>
    <text x="600" y="560" font-family="Arial, sans-serif" font-size="28" fill="#a8a8a8" text-anchor="middle">
      Alan Adı Sahibine Ücretsiz Web Sitesi
    </text>
  </g>

  <!-- Footer -->
  <text x="1150" y="600" font-family="'IBM Plex Mono', monospace" font-size="18" fill="#b87333" text-anchor="end" opacity="0.7">
    ENDUSTRİ RULMAN
  </text>
</svg>
